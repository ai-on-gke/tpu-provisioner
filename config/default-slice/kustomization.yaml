namespace: tpu-provisioner-system

resources:
  - ../default
  - ./webhooks.yaml

patchesStrategicMerge:
  - config_patch.yaml
  - manager_webhook_patch.yaml

patchesJson6902:
- target:
    group: rbac.authorization.k8s.io
    version: v1
    kind: ClusterRole
    name: tpu-provisioner-manager-role
  patch: |-
    - op: add
      path: /rules/-
      value:
        apiGroups:
        - accelerator.gke.io
        resources:
        - slices
        verbs:
        - '*'
    - op: add
      path: /rules/-
      value:
        apiGroups:
        - accelerator.gke.io
        resources:
        - slices/status
        verbs:
        - get
    - op: add
      path: /rules/-
      value:
        apiGroups:
        - leaderworkerset.x-k8s.io
        resources:
        - leaderworkersets
        verbs:
        - get
        - list
        - watch
        - patch
        - update
