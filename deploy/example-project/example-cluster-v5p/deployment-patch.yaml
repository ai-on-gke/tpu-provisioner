apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpu-provisioner-controller-manager
  namespace: tpu-provisioner-system
spec:
  template:
    spec:
      containers:
      - name: manager
        resources:
          limits:
            cpu: "8"
            memory: 8Gi
          requests:
            cpu: "4"
            memory: 4Gi