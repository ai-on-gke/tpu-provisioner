apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpu-provisioner-controller-manager
  namespace: tpu-provisioner-system
spec:
  template:
    spec:
      containers:
      - name: manager
        resources:
          limits:
            cpu: "8"
            memory: 8Gi
          requests:
            cpu: "4"
            memory: 4Gi
        env:
        - name: GCP_PROJECT_ID
          value: <GCP_PROJECT_ID>
        - name: GCP_CLUSTER_LOCATION
          value: <GCP_CLUSTER_LOCATION>
        - name: GCP_ZONE
          value: <GCP_ZONE>
        - name: GCP_CLUSTER
          value: <GCP_CLUSTER>
        - name: GCP_NODE_SERVICE_ACCOUNT
          value: "<PROJECT_NUMBER>-compute@developer.gserviceaccount.com"
        - name: GCP_NODE_TAGS
          value: "allow-internet-egress"
        - name: ENABLE_SLICE_CONTROLLER
          value: "true"
        - name: ENABLE_WEBHOOKS
          value: "true"